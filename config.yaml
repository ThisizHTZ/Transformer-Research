seed: 42

data:
  tickers: ["SPY", "QQQ", "IWM", "AAPL", "MSFT", "NVDA", "AMZN", "META", "GOOGL", "TSLA"]
  start_date: "2015-01-01"
  end_date: null
  sequence_length: 30
  train_ratio: 0.70
  valid_ratio: 0.15

model:
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 128
  dropout: 0.10

train:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5

backtest:
  long_quantile: 0.8
  short_quantile: 0.2
  transaction_cost: 0.0005

paths:
  output_dir: "outputs"


fof:
  fund_returns_path: "outputs/fund_returns.csv"  # columns: date, fund_a, fund_b, ...
  rebalance_freq: "M"         # M/W/Q
  lookback_days: 126
  weight_method: "inv_vol"    # equal / inv_vol / mean_var
  transaction_cost: 0.0005
